<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Product Tycoon — maquette d'intention : le bureau</title>
<style>
  :root{
    --paper:#f4f6f3; --ink:#2a2f38; --muted:#79808d;
    --panel:#10151f; --panel-fg:#e8ecf5; --panel-muted:#8b97b0;
    --good:#2f9e63; --warn:#d99a2b; --bad:#d3543f;
    --wood:#c9b59b; --wood-dark:#a58d73; --wall:#eceee9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e6e9e4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
       display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px}
  .stage{width:1600px;height:900px;position:relative;background:var(--paper);
         border:2px solid var(--ink);overflow:hidden;transform-origin:top center;flex:0 0 auto}

  /* ── LE BANDEAU — allégé : une ligne, pas un tableau de bord ─────── */
  .hud{position:absolute;top:0;left:0;right:0;height:52px;background:var(--panel);
       display:flex;align-items:center;padding:0 24px;gap:26px;z-index:30}
  .stat{display:flex;align-items:center;gap:9px;font-size:16px;color:var(--panel-fg);
        font-variant-numeric:tabular-nums;font-weight:600}
  .stat .ico{font-size:13px;opacity:.85}
  .stat small{font-size:11px;font-weight:500;color:var(--panel-muted)}
  .stat small.up{color:#6ed49b}
  /* l'Impact est une PROGRESSION : l'objectif est là sans être un 2e chiffre */
  .track{height:4px;width:96px;background:rgba(255,255,255,.15);border-radius:2px;position:relative}
  .track i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:2px}
  .hud .spacer{flex:1}
  .sprint{font-size:10.5px;color:var(--panel-muted);letter-spacing:.14em;font-weight:600;
          font-variant-numeric:tabular-nums}

  /* la remontée par exception — invisible tant que tout va bien */
  .alerts{display:flex;gap:8px}
  .alert{display:flex;align-items:center;gap:7px;background:rgba(211,84,63,.18);
         border:1px solid rgba(211,84,63,.55);color:#ffb9a8;padding:5px 12px;border-radius:14px;
         font-size:11.5px;font-weight:600;white-space:nowrap}
  .alert.warn{background:rgba(217,154,43,.16);border-color:rgba(217,154,43,.55);color:#ffd792}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}

  /* ── LE RAIL — au bord de la FENÊTRE DE JEU, pas dans l'ordinateur ─
     Même matière que le bandeau : c'est le châssis du jeu, pas le décor.
     Volontairement en marge — acheter n'est pas le geste de tous les
     sprints, et le centre appartient à ce qu'on fait à chaque tour. */
  .rail{position:absolute;left:0;top:52px;bottom:0;width:92px;background:var(--panel);
        border-right:1px solid rgba(255,255,255,.07);padding:16px 7px;
        display:flex;flex-direction:column;gap:14px;align-items:center;z-index:20}
  /* ── LA PIÈCE ────────────────────────────────────────────────────── */
  .room{position:absolute;top:52px;left:92px;right:0;bottom:0;background:var(--wall)}
  .desk{position:absolute;left:0;right:0;bottom:0;height:54%;
        background:linear-gradient(var(--wood),var(--wood-dark));border-top:3px solid #8d7358}

  /* ── AU MUR : le papier. Ce qui ne serait pas dans un logiciel ───── */
  .pin{position:absolute;background:#fff;border:2px solid var(--ink);border-radius:3px;
       box-shadow:3px 4px 0 rgba(0,0,0,.13);cursor:pointer}
  .pin h4{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
          font-weight:700;margin-bottom:9px}

  .team{left:42px;top:22px;width:290px;padding:13px 15px;transform:rotate(-.8deg)}
  .who{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #eef1f3;font-size:12.5px}
  .who:last-child{border-bottom:none}
  .who .nm{flex:1;font-weight:520}
  .who .rl{font-size:9px;color:var(--muted);letter-spacing:.07em;font-weight:700}
  .who .flag{font-size:9.5px;color:var(--bad);font-weight:700}

  .ledger{left:364px;top:26px;width:214px;padding:12px 14px;background:#fffdf3;
          font-size:11.5px;font-variant-numeric:tabular-nums;transform:rotate(1deg)}
  .ledger div{display:flex;justify-content:space-between;padding:2.5px 0}
  .ledger .p{color:var(--good);font-weight:700}
  .ledger .n{color:var(--bad);font-weight:700}

  /* ── SUR LE PLATEAU : seulement ce qui est vraiment un objet ─────── */
  .obj{position:absolute;cursor:pointer;transition:transform .16s ease;z-index:5}
  .obj:hover{transform:translateY(-8px)}
  .cap{position:absolute;left:50%;transform:translateX(-50%);bottom:-22px;font-size:10px;
       letter-spacing:.11em;color:#584732;text-transform:uppercase;white-space:nowrap;font-weight:700}
  .mug{left:190px;bottom:158px}
  .stamp{right:180px;bottom:150px}
  .keyboard{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;width:430px;height:56px;
            background:#dfe2e4;border:2px solid var(--ink);border-radius:7px;z-index:4}
  .keyboard:after{content:"";position:absolute;inset:9px 12px;border-radius:4px;
                  background:repeating-linear-gradient(90deg,#c6cbcf 0 22px,#dfe2e4 22px 26px)}

  /* ── L'ORDINATEUR : mail, roadmap et dashboard sont des LOGICIELS ── */
  .monitor{position:absolute;left:50%;transform:translateX(-50%);bottom:146px;z-index:6}
  .screen{width:704px;height:428px;background:var(--panel);border:13px solid #3a4150;
          border-radius:11px;overflow:hidden;color:var(--panel-fg);display:flex;flex-direction:column}
  .foot{width:170px;height:30px;background:#3a4150;margin:0 auto;border-radius:0 0 9px 9px}
  .stand{width:250px;height:10px;background:#2f353f;margin:0 auto;border-radius:5px}

  .osbar{height:28px;background:rgba(255,255,255,.06);display:flex;align-items:center;
         padding:0 14px;gap:10px;font-size:10px;letter-spacing:.14em;color:var(--panel-muted);font-weight:700}
  .osbar .back{cursor:pointer;color:#8fb0ff}
  .osmain{flex:1;display:flex;min-height:0}
  .tile{width:78px;padding:11px 4px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.13);
        background:rgba(255,255,255,.05);text-align:center;cursor:pointer}
  .tile:hover{background:rgba(255,255,255,.1);border-color:#5a7ad0}
  .tile .lb{font-size:8.5px;letter-spacing:.07em;color:var(--panel-muted);margin-top:6px;
            font-weight:700;line-height:1.3}
  .tile.off{opacity:.32;cursor:default}
  .tile.off:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.13)}
  .tile.live{border-color:#6ed49b;background:rgba(47,158,99,.16)}
  .tile.live .lb{color:#6ed49b}

  .osbody{flex:1;padding:20px 22px;overflow:hidden;min-width:0}

  /* le bureau du poste de travail : trois applications */
  .apps{display:flex;gap:18px;height:100%;align-items:center;justify-content:center}
  .app{width:190px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
       border-radius:9px;padding:20px 16px;text-align:center;cursor:pointer;position:relative}
  .app:hover{background:rgba(255,255,255,.11);border-color:#5a7ad0}
  .app .nm{font-size:13.5px;font-weight:600;margin-top:12px}
  .app .st{font-size:10.5px;color:var(--panel-muted);margin-top:6px;line-height:1.45}
  .app .st.hot{color:#ffb9a8;font-weight:600}
  .app .bdg{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;
            background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:flex;
            align-items:center;justify-content:center;border:2px solid #10151f}

  .msg{background:rgba(255,255,255,.07);border-left:3px solid #5a7ad0;padding:12px 14px;
       border-radius:0 6px 6px 0;margin-bottom:13px}
  .msg .from{font-size:9.5px;color:var(--panel-muted);letter-spacing:.13em;margin-bottom:5px;font-weight:700}
  .msg .body{font-size:13px;line-height:1.55}
  .replies{display:flex;flex-direction:column;gap:8px}
  .reply{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-radius:6px;
         padding:10px 13px;font-size:12.5px;cursor:pointer}
  .reply:hover{background:rgba(35,64,142,.38);border-color:#5a7ad0}
  .skip{margin-top:12px;font-size:11.5px;color:#ffb9a8;text-align:right;font-weight:600}

  .tools{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .tools button{font:inherit;font-size:13px;padding:9px 17px;border:2px solid var(--ink);background:#fff;
                border-radius:5px;cursor:pointer;color:var(--ink);font-weight:550}
  .tools button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .note{max-width:1120px;text-align:center;font-size:13.5px;color:#454b53;line-height:1.7;min-height:46px}
</style>
</head>
<body>

<div class="tools">
  <button data-view="calme" aria-pressed="true">1 · Le bureau au calme</button>
  <button data-view="alerte" aria-pressed="false">2 · Ça remonte tout seul</button>
  <button data-view="app" aria-pressed="false">3 · Une application ouverte</button>
  <button data-view="comite" aria-pressed="false">4 · La fin de trimestre</button>
</div>
<p class="note" id="note"></p>

<div class="stage" id="stage">

  <div class="hud">
    <span class="stat"><span class="ico">💥</span>184<span class="track"><i style="width:61%"></i></span></span>
    <span class="stat"><span class="ico">💰</span>42 k<small>€</small></span>
    <span class="stat"><span class="ico">👥</span>12 400 <small class="up">+840</small></span>
    <span class="spacer"></span>
    <span class="alerts" id="alerts"></span>
    <span class="sprint">SPRINT 7 · T3</span>
  </div>

  <div class="rail" id="rail"></div>

  <div class="room">

    <!-- AU MUR -->
    <div class="pin team">
      <h4>Équipe · 4</h4>
      <div class="who"><span id="f0"></span><span class="nm">Nadia</span><span class="rl">DEV SR</span></div>
      <div class="who"><span id="f1"></span><span class="nm">Théo</span><span class="rl">DEV JR</span></div>
      <div class="who"><span id="f2"></span><span class="nm">Inès</span><span class="rl">DESIGN</span><span class="flag" id="flag"></span></div>
      <div class="who"><span id="f3"></span><span class="nm">Marc</span><span class="rl">DATA</span></div>
    </div>

    <div class="pin ledger">
      <h4>Sprint 6 — le journal</h4>
      <div><span>Livraisons</span><span class="p">+38</span></div>
      <div><span>Levier ×1,4</span><span class="p">+15</span></div>
      <div><span>Salaires</span><span class="n">−12 k€</span></div>
      <div><span>Churn</span><span class="n">−210</span></div>
    </div>

    <div class="desk"></div>

    <!-- SUR LE PLATEAU : la tasse et le tampon. Rien d'autre. -->
    <div class="obj mug">
      <svg width="118" height="98" viewBox="0 0 118 98">
        <path d="M84 30 h12 a16 16 0 0 1 0 32 h-12" fill="none" stroke="#2a2f38" stroke-width="4"/>
        <path d="M10 12 h76 v46 a30 30 0 0 1 -76 0 z" id="cupbody" fill="#fff" stroke="#2a2f38" stroke-width="3"/>
        <text x="48" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="#2a2f38"
              font-family="system-ui" id="energy">10</text>
      </svg>
      <span class="cap">Énergie</span>
    </div>

    <div class="obj stamp">
      <svg width="116" height="98" viewBox="0 0 116 98">
        <rect x="14" y="34" width="88" height="58" rx="5" fill="#2f9e63" stroke="#2a2f38" stroke-width="3"/>
        <rect x="44" y="10" width="28" height="26" rx="4" fill="#3a4150" stroke="#2a2f38" stroke-width="3"/>
        <text x="58" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#fff"
              font-family="system-ui" letter-spacing="1">CLORE</text>
      </svg>
      <span class="cap">Fin de sprint</span>
    </div>

    <div class="keyboard"></div>

    <!-- L'ORDINATEUR -->
    <div class="monitor">
      <div class="screen">
        <div class="osbar" id="osbar"></div>
        <div class="osmain">
          <div class="osbody" id="osbody"></div>
        </div>
      </div>
      <div class="stand"></div>
      <div class="foot"></div>
    </div>
  </div>
</div>

<script>
/* Un visage dessiné, pas un emoji : la nuance content / pas content doit se lire
   sans dépendre d'une police à emoji couleur. */
function face(mood){
  const skin = mood==="ok" ? "#dfe6ea" : mood==="meh" ? "#efe6d5" : "#f6dcd4";
  const mouth = mood==="ok" ? "M9 20 q7 6 14 0" : mood==="meh" ? "M9 21 h14" : "M9 23 q7 -7 14 0";
  const brow = mood==="bad" ? '<path d="M7 9 l7 3 M25 9 l-7 3" stroke="#2a2f38" stroke-width="2" fill="none"/>' : "";
  return `<svg width="30" height="30" viewBox="0 0 32 32" style="flex:0 0 30px">
    <circle cx="16" cy="16" r="14" fill="${skin}" stroke="#2a2f38" stroke-width="2"/>
    <circle cx="11" cy="14" r="1.9" fill="#2a2f38"/><circle cx="21" cy="14" r="1.9" fill="#2a2f38"/>
    ${brow}<path d="${mouth}" stroke="#2a2f38" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
}

const RAIL_ICON = {
  shop:`<svg width="30" height="28" viewBox="0 0 30 28"><path d="M3 9 h24 l-2 17 h-20 z" fill="none"
        stroke="currentColor" stroke-width="2.6"/><path d="M10 11 v-4 a5 5 0 0 1 10 0 v4" fill="none"
        stroke="currentColor" stroke-width="2.6"/></svg>`,
  comite:`<svg width="30" height="28" viewBox="0 0 30 28"><path d="M4 24 h22 M6 24 v-11 M12 24 v-11
        M18 24 v-11 M24 24 v-11 M2 13 h26 L15 4 z" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linejoin="round"/></svg>`,
  target:`<svg width="30" height="28" viewBox="0 0 30 28"><circle cx="15" cy="14" r="11" fill="none"
        stroke="currentColor" stroke-width="2.4"/><circle cx="15" cy="14" r="5.5" fill="none"
        stroke="currentColor" stroke-width="2.4"/><circle cx="15" cy="14" r="1.6" fill="currentColor"/></svg>`
};

const ICON = {
  mail:`<svg width="52" height="40" viewBox="0 0 52 40"><rect x="2" y="2" width="48" height="36" rx="4"
        fill="none" stroke="#c8d2e8" stroke-width="3"/><path d="M2 6 L26 24 L50 6" fill="none"
        stroke="#c8d2e8" stroke-width="3"/></svg>`,
  road:`<svg width="46" height="44" viewBox="0 0 46 44"><rect x="2" y="2" width="18" height="40" rx="3"
        fill="none" stroke="#c8d2e8" stroke-width="3"/><rect x="26" y="2" width="18" height="24" rx="3"
        fill="none" stroke="#c8d2e8" stroke-width="3"/></svg>`,
  dash:`<svg width="50" height="40" viewBox="0 0 50 40"><polyline points="3,34 15,26 25,18 34,12 47,4"
        fill="none" stroke="#6ed49b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};

function rail(v){
  const t = (cls,ico,lb) => `<div class="tile ${cls}" style="color:${
      cls==="live" ? "#6ed49b" : cls==="off" ? "#8b97b0" : "#c8d2e8"}">${RAIL_ICON[ico]}
      <div class="lb">${lb}</div></div>`;
  return t("", "shop", "ÉTAL DU<br>SPRINT")
       + t(v.comite ? "live" : "off", "comite", v.comite ? "COMITÉ<br>OUVERT" : "COMITÉ<br>T4")
       + t("", "target", "OBJECTIF<br>T3");
}

function apps(v){
  return `<div class="apps">
    <div class="app">${v.mail>0?`<span class="bdg">${v.mail}</span>`:""}${ICON.mail}
      <div class="nm">Boîte mail</div><div class="st${v.mail>0?" hot":""}">${v.mailSt}</div></div>
    <div class="app">${ICON.road}
      <div class="nm">Roadmap</div><div class="st${v.jam?" hot":""}">${v.roadSt}</div></div>
    <div class="app">${ICON.dash}
      <div class="nm">Tableau de bord</div><div class="st">${v.dashSt}</div></div>
  </div>`;
}

const MAILAPP = `
  <div class="msg">
    <div class="from">DIRECTION · SPRINT 7</div>
    <div class="body">Un concurrent vient de sortir la feature que vous aviez repoussée deux fois.
      Le board demande une réponse d'ici la fin du trimestre.</div>
  </div>
  <div class="replies">
    <div class="reply">Bloquer le sprint dessus &nbsp;·&nbsp; l'équipe encaisse</div>
    <div class="reply">Assumer le retard &nbsp;·&nbsp; le board encaisse</div>
    <div class="reply">🔒 Demander l'avis de l'équipe &nbsp;·&nbsp; coûte ⚡</div>
  </div>
  <div class="skip">Ne pas répondre → se résout au pire, à la clôture</div>`;

const COMITE = `
  <div style="font-size:11px;letter-spacing:.13em;color:#6ed49b;font-weight:700;margin-bottom:12px">
    TRIMESTRE 3 FRANCHI · 💥 62 À ENGAGER</div>
  <div class="replies">
    <div class="reply"><b>Décision stratégique</b> &nbsp;·&nbsp; 1 par trimestre, irréversible &nbsp;·&nbsp; 💥 40</div>
    <div class="reply"><b>Capacité d'outillage</b> &nbsp;·&nbsp; +1 slot &nbsp;·&nbsp; 💥 28</div>
    <div class="reply"><b>Relever le cap d'effectif</b> &nbsp;·&nbsp; 5 → 6 &nbsp;·&nbsp; 💥 22</div>
  </div>
  <div class="skip" style="color:#8b97b0">Le prochain quota double. Ce que vous n'engagez pas reste au portefeuille.</div>`;

const VIEWS = {
  calme:{
    note:"Trois chiffres sur une ligne, et rien d'autre. Le Moral, la Dette, le Capital politique, le Cynisme, le Levier, les charges : tout tourne, rien n'est écrit. Le poste de travail montre ses trois logiciels ; le papier reste au mur ; sur le plateau il ne reste que ce qui est vraiment un objet.",
    alerts:[], moods:["ok","ok","ok","ok"], flag:"", jam:false, energy:10, low:false,
    mail:2, mailSt:"2 messages", roadSt:"6 tickets au backlog", dashSt:"12 400 utilisateurs",
    comite:false, open:null
  },
  alerte:{
    note:"Rien n'a été cliqué : c'est le jeu qui vient prévenir. Inès décroche — son visage change au mur avant qu'un seul chiffre soit affiché — et l'application Roadmap signale la congestion. Les seuils vivent dans balance.json, et le motif existe déjà dans le code de #43 (get_employee_alert, alertAt: 25).",
    alerts:[["bad","Inès décroche"],["warn","Dette · livraisons ralenties"]],
    moods:["ok","meh","bad","meh"], flag:"décroche", jam:true, energy:2, low:true,
    mail:2, mailSt:"2 messages · 1 urgent", roadSt:"Congestionnée · −2 pts de capacité",
    dashSt:"12 400 · croissance qui fléchit", comite:false, open:null
  },
  app:{
    note:"L'application s'ouvre dans l'écran, et le bureau continue d'exister autour : l'équipe au mur, la tasse, le tampon. On peut fermer, aller ouvrir la Roadmap pour vérifier son backlog, puis revenir répondre. On peut aussi ne pas répondre — ça se résout dans la pire branche, et ça se paie.",
    alerts:[["bad","Inès décroche"]], moods:["ok","meh","bad","meh"], flag:"décroche",
    jam:true, energy:2, low:true, mail:2, mailSt:"", roadSt:"", dashSt:"",
    comite:false, open:"Boîte mail"
  },
  comite:{
    note:"La fin de trimestre est un moment à part, et ça se voit : la tuile Comité s'allume, elle ne l'était à aucun autre sprint. L'étal du sprint, lui, est resté ouvert tout du long — deux boutiques, deux rythmes. Le rail est volontairement en marge : acheter n'est pas le geste de tous les sprints.",
    alerts:[], moods:["ok","ok","meh","ok"], flag:"", jam:false, energy:6, low:false,
    mail:0, mailSt:"", roadSt:"", dashSt:"", comite:true, open:"Comité d'investissement"
  }
};

function apply(name){
  const v = VIEWS[name];
  document.getElementById("note").textContent = v.note;
  document.getElementById("alerts").innerHTML =
    v.alerts.map(([c,t])=>`<span class="alert ${c==="warn"?"warn":""}"><i class="dot"></i>${t}</span>`).join("");
  v.moods.forEach((m,i)=>{ document.getElementById("f"+i).innerHTML = face(m); });
  document.getElementById("flag").textContent = v.flag;
  document.getElementById("energy").textContent = v.energy;
  document.getElementById("cupbody").setAttribute("fill", v.low ? "#f2e2dd" : "#fff");
  document.getElementById("osbar").innerHTML = v.open
    ? `<span class="back">◂ POSTE DE TRAVAIL</span><span>·</span><span>${v.open.toUpperCase()}</span>`
    : `<span>POSTE DE TRAVAIL</span>`;
  document.getElementById("rail").innerHTML = rail(v);
  document.getElementById("osbody").innerHTML =
    v.open === "Comité d'investissement" ? COMITE : v.open ? MAILAPP : apps(v);
  document.querySelectorAll(".tools button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.view===name)));
}
document.querySelectorAll(".tools button").forEach(b=>
  b.addEventListener("click",()=>apply(b.dataset.view)));
apply("calme");

function fit(){
  const s=document.getElementById("stage");
  const k=Math.min(1,(window.innerWidth-44)/1600);
  s.style.transform=`scale(${k})`;
  s.style.height=`${900*k}px`;
}
window.addEventListener("resize",fit); fit();
</script>
</body>
</html>
